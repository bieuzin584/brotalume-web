name: Publicar Brotalume no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web-release.zip.part-*'
      - 'release.json'
      - '.github/workflows/deploy.yml'
      - 'verify-release.mjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validar e extrair o site
        run: node verify-release.mjs . --extract
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
